name: beadot
description: Turn photos into iron bead patterns
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.3.0
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.3
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
